<style>
    .browser * {
        box-sizing: border-box;
    }

    .browser {
        position: relative;
        background: white;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15), 0 6px 10px rgba(0, 0, 0, 0.1);
        max-width: 100%;
        margin: auto;
        margin-bottom: 0;
        border-radius: 5px; /* all corners */
        padding-top: 45px; /* browser bar */
        background-image: radial-gradient(circle, #EB7061 6px, transparent 6px), radial-gradient(circle, #F5D160 6px, transparent 6px), radial-gradient(circle, #81D982 6px, transparent 6px), radial-gradient(circle, #d4d4d4 2px, transparent 2px), radial-gradient(circle, #d4d4d4 2px, transparent 2px), radial-gradient(circle, #d4d4d4 2px, transparent 2px), linear-gradient(to bottom, #efefef 45px, transparent 0);
        background-position: left top, left top, left top, right top, right top, right top, 0 0;
        background-size: 50px 45px, 90px 45px, 130px 45px, 50px 30px, 50px 45px, 50px 60px, 100%;
        background-repeat: no-repeat;
    }

        .browser[url]:after {
            content: attr(url);
            color: #a3a3a3;
            font-size: 13px;
            font-weight: 400;
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            padding: 6px 15px;
            margin: 9px 50px 0 90px;
            border-radius: 25px;
            background: #ffffff;
            height: 27px;
            box-sizing: border-box;
            white-space: nowrap;
            overflow: hidden;
        }

    .iframe-wrapper {
        position: relative;
        overflow: hidden;
        padding-top: 56.25%; /* adjust this to match the aspect ratio of iframe content if not 16:9*/
    }

        .iframe-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
        }
</style>

<div class="browser" url="{{ include.url }}">
    <div class="iframe-wrapper">
        <iframe src="{{ include.url }}" frameborder="0" allowfullscreen></iframe>
    </div>
</div>
