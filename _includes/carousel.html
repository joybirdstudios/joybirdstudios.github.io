<div class="isolated-carousel {% if include.variant %}{{ include.variant }}{% endif %}" data-autoplay="{% if include.autoplay %}true{% else %}false{% endif %}">
    <div class="carousel-slides">
        {% for slide in include.slides %}
        <!-- Slide {{ forloop.index }} -->
        <div class="carousel-slide {% if forloop.first %}active{% endif %}">
            <img src="{{ slide.image }}" alt="{{ slide.alt }}">
        </div>
        {% endfor %}

        <!-- Navigation Arrows -->
        <button class="carousel-arrow prev">&#10094;</button>
        <button class="carousel-arrow next">&#10095;</button>
    </div>

    <!-- Dots Indicator -->
    <div class="carousel-dots">
        {% for slide in include.slides %}
        <span class="carousel-dot {% if forloop.first %}active{% endif %}" data-index="{{ forloop.index0 }}"></span>
        {% endfor %}
    </div>
</div>
